[package]
name = "runtime-bench-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
