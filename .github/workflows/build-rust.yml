name: Build and publish stable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  build:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            name: arm64-v8a
            toolchain: stable
          - target: mipsel-unknown-linux-musl
            name: mips32le
            toolchain: nightly
            rustflags: "-C target-feature=+crt-static -L /usr/local/mipsel-linux-muslsf/lib -L /usr/local/lib/gcc/mipsel-linux-muslsf/9.2.0"
          - target: mips-unknown-linux-musl
            name: mips32
            toolchain: nightly
            rustflags: "-C target-feature=+crt-static -L /usr/local/mips-linux-muslsf/lib -L /usr/local/lib/gcc/mips-linux-muslsf/9.2.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Validate tag and set package version
        working-directory: backend
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\+pwa\.([1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable fork tag such as v1.2.3+pwa.1"
            exit 1
          fi
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          sed -i "0,/^version = .*/s//version = \"$PACKAGE_VERSION\"/" Cargo.toml
          ACTUAL_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xkeen-ui") | .version')"
          if [ "$ACTUAL_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Cargo package version $ACTUAL_VERSION does not match release tag $RELEASE_TAG"
            exit 1
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal -c rust-src

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Install cross
        run: |
          if ! command -v cross >/dev/null 2>&1; then
            cargo install cross --git https://github.com/cross-rs/cross
          fi

      - name: Inject frontend dist for cross
        working-directory: backend
        run: |
          cp -R ../frontend/dist ./dist
          sed -i 's|\.\./frontend/dist|./dist|' src/frontend_embedder.rs

      - name: Build binary
        working-directory: backend
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          set -euo pipefail
          cross +"${{ matrix.toolchain }}" build --release --target "${{ matrix.target }}"
          install -m 755 "target/${{ matrix.target }}/release/xkeen-ui" "../xkeen-ui-${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: xkeen-ui-${{ matrix.name }}
          path: xkeen-ui-${{ matrix.name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: xkeen-ui-*
          path: artifacts
          merge-multiple: true

      - name: Verify release assets and generate notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for asset in xkeen-ui-arm64-v8a xkeen-ui-mips32le xkeen-ui-mips32; do
            test -s "artifacts/$asset" || {
              echo "::error::Missing release asset: $asset"
              exit 1
            }
          done

          PREVIOUS_TAG="$(git describe --tags --match 'v*+pwa.*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            git log --reverse --pretty=format:'- %s (%h)' "$PREVIOUS_TAG..$RELEASE_TAG" > release-notes.md
          else
            git log --reverse --max-count=100 --pretty=format:'- %s (%h)' "$RELEASE_TAG" > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            printf 'Stable XKeen UI fork release %s.\n' "$RELEASE_TAG" > release-notes.md
          fi

      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            artifacts/xkeen-ui-arm64-v8a \
            artifacts/xkeen-ui-mips32le \
            artifacts/xkeen-ui-mips32 \
            --title "XKeen UI $RELEASE_TAG" \
            --notes-file release-notes.md \
            --latest
