name: Sync upstream main

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main into integration branch
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/zxc-rv/XKeen-UI.git
          git fetch origin main
          if git ls-remote --exit-code --heads origin upstream-sync/main >/dev/null 2>&1; then
            git fetch origin +refs/heads/upstream-sync/main:refs/remotes/origin/upstream-sync/main
          fi
          git fetch upstream main

          git checkout -B upstream-sync/main origin/main
          if ! git merge --no-edit --no-ff upstream/main; then
            git merge --abort
            echo "::error::Upstream changes conflict with the fork. Resolve the conflict in a dedicated branch, then rerun the sync."
            exit 1
          fi

          if git diff --quiet origin/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push --force-with-lease origin HEAD:refs/heads/upstream-sync/main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git merge-base origin/main upstream/main)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.sync.outputs.changed == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.sync.outputs.changed == 'true'

      - name: Build synced frontend
        if: steps.sync.outputs.changed == 'true'
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Test synced backend
        if: steps.sync.outputs.changed == 'true'
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Create or update upstream pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          UPSTREAM_PR_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          BASE_SHA: ${{ steps.sync.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [ -z "$UPSTREAM_PR_TOKEN" ]; then
            echo "::error::Add a fine-grained repository secret named UPSTREAM_PR_TOKEN with Pull requests read/write access."
            exit 1
          fi

          pr_number="$(GH_TOKEN="$UPSTREAM_PR_TOKEN" gh api \
            'repos/Arap919/xkeen-ui-pwa-fork/pulls?state=open&head=Arap919:upstream-sync/main&base=main&per_page=1' \
            --jq '.[0].number // empty')"
          body="$(printf 'Imports upstream changes through `%s`.\n\nReview the upstream diff: https://github.com/zxc-rv/XKeen-UI/compare/%s...%s' "$UPSTREAM_SHA" "$BASE_SHA" "$UPSTREAM_SHA")"

          if [ -n "$pr_number" ]; then
            GH_TOKEN="$UPSTREAM_PR_TOKEN" gh api \
              "repos/Arap919/xkeen-ui-pwa-fork/pulls/$pr_number" \
              --method PATCH \
              -f title="Sync upstream main" \
              -f body="$body"
          else
            GH_TOKEN="$UPSTREAM_PR_TOKEN" gh api \
              repos/Arap919/xkeen-ui-pwa-fork/pulls \
              --method POST \
              -f title="Sync upstream main" \
              -f head=upstream-sync/main \
              -f base=main \
              -f body="$body"
          fi
