name: Tag synced upstream release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: upstream-release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'upstream-sync/main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::UPSTREAM_PR_TOKEN must have Contents read/write and Pull requests read/write access."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_PR_TOKEN }}

      - name: Fetch upstream versions and synced commit
        env:
          SYNC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SYNC_HEAD_SHA"
          git fetch --no-tags https://github.com/zxc-rv/XKeen-UI.git "+refs/tags/v*:refs/upstream-tags/v*"

      - name: Select release tag
        id: version
        env:
          SYNC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).splitlines()

          stable = r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          fork = re.compile(stable + r"\+pwa\.([1-9][0-9]*)")
          existing = git("tag", "--points-at", os.environ["MERGE_SHA"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              if any(fork.fullmatch(tag) for tag in existing):
                  print("exists=true", file=output)
                  sys.exit(0)

              # Use the PR source commit so squash and rebase merges retain upstream ancestry.
              versions = []
              for ref in git("for-each-ref", "--merged=" + os.environ["SYNC_HEAD_SHA"],
                             "--format=%(refname)", "refs/upstream-tags/"):
                  match = re.fullmatch(stable, ref.removeprefix("refs/upstream-tags/"))
                  if match:
                      versions.append(tuple(map(int, match.groups())))
              if not versions:
                  sys.exit("No stable upstream tag is reachable from the synced commit")
              base = "v" + ".".join(map(str, max(versions)))
              revisions = []
              for tag in git("tag", "--list", base + "+pwa.*"):
                  match = fork.fullmatch(tag)
                  if match:
                      revisions.append(int(match.group(4)))
              tag = base + "+pwa." + str(max(revisions, default=0) + 1)
              print("tag=" + tag, file=output)
              print("Selected release tag: " + tag)
          PYTHON

      - name: Push release tag
        if: steps.version.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$MERGE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
